name: Build APK Native (CDE)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-android-native:
    name: 🚀 Build Android APK (Native)
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci
      
      - name: 🔑 Setup Expo without EAS
        run: |
          echo "🔑 Installing Expo CLI..."
          npm install -g expo-cli
      
      - name: 🏗️ Prebuild Android native files
        run: |
          echo "🏗️ Generating Android native files..."
          npx expo prebuild --platform android --clean
          echo "✅ Android files generated"
          ls -la android/
      
      - name: 🔧 Configure Gradle
        run: |
          echo "🔧 Configuring Gradle..."
          cd android
          
          if [ ! -f "local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "✅ Created local.properties"
          fi
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Gradle wrapper ready"
          else
            echo "❌ No gradle wrapper found"
            exit 1
          fi
      
      - name: 🔨 Build APK with Gradle
        run: |
          echo "🔨 Building APK..."
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "✅ APK built successfully"
          find app/build/outputs/apk/release/ -name "*.apk" -type f
      
      - name: 📝 Rename APK
        run: |
          echo "📝 Renaming APK..."
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "cde.apk"
            APK_SIZE=$(du -h "cde.apk" | cut -f1)
            echo "✅ APK renamed: cde.apk ($APK_SIZE)"
            ls -lh "cde.apk"
          else
            echo "❌ No APK found"
            exit 1
          fi
      
      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cde-apk
          path: cde.apk
          retention-days: 90
      
      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cde.apk
          body: |
            # 🚀 CDE APK
            
            **Build Method**: Native Android (Gradle)  
            **No Expo Account Required**: ✅  
            **Completely Free**: ✅
            
            ## 📥 Installation
            
            1. Téléchargez `cde.apk`
            2. Transférez sur votre téléphone Android
            3. Activez "Sources inconnues" si nécessaire
            4. Installez l'APK
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
