name: Build APK Direct (No EAS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build APK avec Gradle Direct
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🗑️ Clean everything
        run: |
          rm -rf node_modules
          rm -rf android
          rm -rf ios
          rm -rf .expo
          npm cache clean --force

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔧 Setup Expo
        run: npm install -g expo-cli eas-cli

      - name: 🏗️ Prebuild (Generate native Android files)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx expo prebuild --platform android --clean

      - name: 📝 Configure Android Package Name
        run: |
          cd android/app
          # Ensure build.gradle has the correct package configuration
          sed -i 's/namespace ".*"/namespace "com.cde.app"/' build.gradle
          sed -i 's/applicationId ".*"/applicationId "com.cde.app"/' build.gradle
          echo "=== Android build.gradle ===" 
          cat build.gradle | grep -E "namespace|applicationId|packageName"

      - name: 🔧 Ensure Gradle 8.14
        run: |
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip' > android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: 📝 Create keystore
        run: |
          cd android/app
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore release.keystore \
            -alias cde \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CDE, OU=Dev, O=CDE, L=Paris, S=IDF, C=FR"

      - name: 🏗️ Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=1 --parallel=false
          
      - name: 📦 Find and rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" cde.apk
          ls -lh cde.apk

      - name: 📊 Get APK info
        id: apk_info
        run: |
          APK_SIZE=$(ls -lh cde.apk | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $APK_SIZE"

      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cde-apk
          path: cde.apk
          retention-days: 30

      - name: 🏷️ Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cde.apk
          fail_on_unmatched_files: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Build Direct Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: ${{ steps.apk_info.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: Direct Gradle (No EAS Cache)" >> $GITHUB_STEP_SUMMARY
